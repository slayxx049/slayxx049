.d1{animation-duration:2.6s}.d2{animation-duration:3.7s;animation-delay:-1s}.d3{animation-duration:2.9s;animation-delay:-2s}.d4{animation-duration:4.1s;animation-delay:-.5s}.d5{animation-duration:3.3s;animation-delay:-1.6s}
