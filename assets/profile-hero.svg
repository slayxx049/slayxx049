<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Slayxx049, CSE AI and ML software builder. BTCUSDT order-book style panel with simulated ask and bid depth.">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0f1e"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
 <radialGradient id="glowA" cx=".12" cy=".05" r=".65"><stop stop-color="#1f6feb" stop-opacity=".38"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowB" cx=".92" cy="1" r=".6"><stop stop-color="#8957e5" stop-opacity=".32"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
 <linearGradient id="name" x1="0" x2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#c7d2fe"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
 <clipPath id="frame"><rect width="1200" height="460" rx="22"/></clipPath>
</defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.bar{transform-box:fill-box;transform-origin:100% 50%;animation:depth 3s ease-in-out infinite alternate}
@keyframes depth{0%{transform:scaleX(.55)}45%{transform:scaleX(1)}100%{transform:scaleX(.72)}}
.d1{animation-duration:2.6s}.d2{animation-duration:3.7s;animation-delay:-1s}.d3{animation-duration:2.9s;animation-delay:-2s}.d4{animation-duration:4.1s;animation-delay:-.5s}.d5{animation-duration:3.3s;animation-delay:-1.6s}
.tickA{animation:tickA 4s steps(1) infinite}.tickB{animation:tickB 4s steps(1) infinite}@keyframes tickA{0%{opacity:1}50%{opacity:0}}@keyframes tickB{0%{opacity:0}50%{opacity:1}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes rise{to{opacity:1;transform:none}}.r2{animation-delay:.12s}.r3{animation-delay:.24s}.r4{animation-delay:.36s}.r5{animation-delay:.48s}
</style>
