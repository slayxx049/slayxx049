<rect x="24" y="294" width="1152" height="82" rx="12" fill="#010409" stroke="#30363d"/>
<text x="46" y="324" class="mono" font-size="11" letter-spacing="1.2" fill="#6e7681">DESIGN PRINCIPLE</text>
<text x="46" y="352" class="sans" font-size="17" font-weight="600" fill="#e6edf3">A score should expose the matching signals behind it — not hide them behind an unexplained prediction.</text>
<text x="1150" y="402" class="mono" font-size="10.5" fill="#6e7681" text-anchor="end">PROJECT ARCHITECTURE · HIGH-LEVEL VIEW</text>
