<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="AI Job Finder architecture: candidate profile and job sources flow through parsing and normalization, rule-based scoring, ranked results, and a Streamlit interface.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#0d1117"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".06"/></pattern></defs>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.node{opacity:0;animation:show .5s ease-out forwards}@keyframes show{to{opacity:1}}.n2{animation-delay:.15s}.n3{animation-delay:.3s}.n4{animation-delay:.45s}.n5{animation-delay:.6s}.flow{stroke-dasharray:8 8;animation:dash 2s linear infinite}@keyframes dash{to{stroke-dashoffset:-32}}</style>
<rect width="1200" height="420" rx="20" fill="url(#bg)"/><rect width="1200" height="420" rx="20" fill="url(#dots)"/><rect x=".5" y=".5" width="1199" height="419" rx="20" fill="none" stroke="#30363d"/>
<text x="24" y="44" class="mono" font-size="12.5" letter-spacing="1.5" fill="#8b949e">AI JOB FINDER · APPLICATION FLOW</text>
<text x="24" y="78" class="sans" font-size="25" font-weight="800" fill="#e6edf3">From candidate profile to ranked opportunities</text>
<g fill="none" stroke="#30363d" stroke-width="2"><path d="M200 190H250"/><path d="M420 190H470"/><path d="M640 190H690"/><path d="M860 190H910"/></g>
<g fill="none" stroke="#58a6ff" stroke-width="2.5" class="flow"><path d="M200 190H250"/><path d="M420 190H470"/><path d="M640 190H690"/><path d="M860 190H910"/></g>
<g class="sans">
 <g class="node"><rect x="24" y="124" width="176" height="132" rx="12" fill="#161b22" stroke="#388bfd"/><text x="42" y="154" class="mono" font-size="11" fill="#79c0ff">01 · INPUT</text><text x="42" y="188" font-size="19" font-weight="700" fill="#e6edf3">Candidate</text><text x="42" y="213" font-size="13" fill="#8b949e">Resume · skills</text><text x="42" y="234" font-size="13" fill="#8b949e">Role preferences</text></g>
 <g class="node n2"><rect x="250" y="124" width="170" height="132" rx="12" fill="#161b22" stroke="#a371f7"/><text x="268" y="154" class="mono" font-size="11" fill="#d2a8ff">02 · DISCOVERY</text><text x="268" y="188" font-size="19" font-weight="700" fill="#e6edf3">Job sources</text><text x="268" y="213" font-size="13" fill="#8b949e">Listings collection</text><text x="268" y="234" font-size="13" fill="#8b949e">Field normalization</text></g>
 <g class="node n3"><rect x="470" y="124" width="170" height="132" rx="12" fill="#161b22" stroke="#d29922"/><text x="488" y="154" class="mono" font-size="11" fill="#e3b341">03 · PARSING</text><text x="488" y="188" font-size="19" font-weight="700" fill="#e6edf3">Extract</text><text x="488" y="213" font-size="13" fill="#8b949e">Skills · title · details</text><text x="488" y="234" font-size="13" fill="#8b949e">Structured signals</text></g>
 <g class="node n4"><rect x="690" y="124" width="170" height="132" rx="12" fill="#161b22" stroke="#f85149"/><text x="708" y="154" class="mono" font-size="11" fill="#ff7b72">04 · MATCHING</text><text x="708" y="188" font-size="19" font-weight="700" fill="#e6edf3">Rule scoring</text><text x="708" y="213" font-size="13" fill="#8b949e">Compare criteria</text><text x="708" y="234" font-size="13" fill="#8b949e">Explainable signals</text></g>
 <g class="node n5"><rect x="910" y="124" width="266" height="132" rx="12" fill="#161b22" stroke="#3fb950"/><text x="930" y="154" class="mono" font-size="11" fill="#56d364">05 · RESULTS</text><text x="930" y="188" font-size="19" font-weight="700" fill="#e6edf3">Ranked opportunities</text><text x="930" y="213" font-size="13" fill="#8b949e">Match score · key signals</text><text x="930" y="234" font-size="13" fill="#8b949e">Review in Streamlit UI</text></g>
